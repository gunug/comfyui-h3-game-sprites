Repository = "https://github.com/gunug/comfyui-h3-game-sprites"
"Upstream project" = "https://github.com/gary149/h3-game-sprites"

[tool.comfy]
PublisherId = "gunug"
DisplayName = "H3 Game Sprites"
Icon = ""
